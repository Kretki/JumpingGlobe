<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WGS84 Ellipsoid</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #hint {
        position: fixed;
        left: 16px;
        bottom: 104px;
        color: #9aa4b2;
        font: 14px/1.4 system-ui, sans-serif;
        pointer-events: none;
        user-select: none;
      }
      #coords {
        position: fixed;
        left: 16px;
        top: 16px;
        color: #c5d0de;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
        user-select: none;
        background: rgba(11, 15, 20, 0.72);
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(154, 164, 178, 0.2);
      }
      #coords b {
        color: #e8eef7;
        font-weight: 600;
      }
      #land-progress {
        position: fixed;
        right: 16px;
        top: 16px;
        width: min(280px, calc(100vw - 32px));
        color: #c5d0de;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
        user-select: none;
        background: rgba(11, 15, 20, 0.82);
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid rgba(154, 164, 178, 0.25);
        opacity: 0;
        transform: translateY(-6px);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      #land-progress.visible {
        opacity: 1;
        transform: translateY(0);
      }
      #land-progress .title {
        color: #e8eef7;
        font-weight: 600;
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      #land-progress .pct {
        color: #7dd3a7;
        font-variant-numeric: tabular-nums;
      }
      #land-progress .bar {
        height: 6px;
        border-radius: 3px;
        background: rgba(154, 164, 178, 0.18);
        overflow: hidden;
        margin-bottom: 6px;
      }
      #land-progress .bar > i {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: linear-gradient(90deg, #3d9a6a, #7dd3a7);
        transition: width 0.12s ease-out;
      }
      #land-progress .label {
        color: #9aa4b2;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #timeline {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        color: #c5d0de;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: rgba(11, 15, 20, 0.82);
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid rgba(154, 164, 178, 0.25);
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 6px 14px;
      }
      #timeline button {
        font: inherit;
        color: #e8eef7;
        background: rgba(125, 211, 167, 0.14);
        border: 1px solid rgba(125, 211, 167, 0.45);
        border-radius: 6px;
        padding: 4px 12px;
        cursor: pointer;
        min-width: 84px;
      }
      #timeline button:hover {
        background: rgba(125, 211, 167, 0.26);
      }
      #timeline button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #tl-age {
        width: 100%;
        accent-color: #7dd3a7;
        cursor: pointer;
      }
      #tl-readout {
        color: #e8eef7;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        /* fixed width: the slider must not resize while the label changes */
        width: 22ch;
        text-align: right;
        white-space: nowrap;
      }
      #tl-scale {
        grid-column: 2;
        display: flex;
        justify-content: space-between;
        color: #9aa4b2;
        font-size: 11px;
        margin-top: -6px;
      }
      #tl-options {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        align-items: center;
        color: #9aa4b2;
        font-size: 12px;
      }
      #tl-options select,
      #tl-options input {
        font: inherit;
        accent-color: #7dd3a7;
      }
      #tl-options select {
        color: #e8eef7;
        background: #0b0f14;
        border: 1px solid rgba(154, 164, 178, 0.3);
        border-radius: 4px;
      }
      #tl-status {
        margin-left: auto;
        color: #e0b872;
      }
      #tl-status:empty {
        display: none;
      }
      #point-panel {
        position: fixed;
        right: 16px;
        bottom: 128px;
        width: min(330px, calc(100vw - 32px));
        color: #c5d0de;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: rgba(11, 15, 20, 0.86);
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(154, 164, 178, 0.25);
      }
      #point-panel .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #e8eef7;
        font-weight: 600;
        margin-bottom: 4px;
      }
      #point-panel .head i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff5a4f;
        border: 2px solid #fff;
        margin-right: 6px;
        vertical-align: -1px;
      }
      #point-panel button {
        font: inherit;
        color: #9aa4b2;
        background: none;
        border: 1px solid rgba(154, 164, 178, 0.3);
        border-radius: 4px;
        padding: 0 8px;
        cursor: pointer;
      }
      #point-panel dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
      }
      #point-panel dt {
        color: #9aa4b2;
      }
      #point-panel dd {
        color: #e8eef7;
        font-variant-numeric: tabular-nums;
      }
      #point-panel .note {
        color: #e0b872;
        font-size: 12px;
        margin-top: 4px;
      }
      #point-panel .note:empty {
        display: none;
      }
      @media (max-width: 560px) {
        #hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="coords"></div>
    <div id="land-progress" aria-live="polite">
      <div class="title">
        <span>Land load</span>
        <span class="pct">0%</span>
      </div>
      <div class="bar"><i id="land-progress-fill"></i></div>
      <div class="label" id="land-progress-label">Idle</div>
    </div>
    <div id="timeline" aria-label="Plate reconstruction timeline">
      <button id="tl-play" type="button" disabled>▶ Play</button>
      <input id="tl-age" type="range" min="0" max="1140" step="1" value="1140" disabled aria-label="Timeline from the past (left) to the present (right)" />
      <output id="tl-readout" for="tl-age">0 Ma</output>
      <div id="tl-scale"><span id="tl-start">1140 Ma</span><span id="tl-end">Present</span></div>
      <div id="tl-options">
        <label>Speed
          <select id="tl-speed">
            <option value="5">5 Myr/s</option>
            <option value="20" selected>20 Myr/s</option>
            <option value="50">50 Myr/s</option>
            <option value="100">100 Myr/s</option>
          </select>
        </label>
        <label title="Run the timeline from the present into the past"><input id="tl-reverse" type="checkbox" /> Present → past</label>
        <span id="tl-status" aria-live="polite">Loading rotation model…</span>
      </div>
    </div>
    <section id="point-panel" aria-live="polite" hidden>
      <div class="head">
        <span><i></i>Selected point</span>
        <button id="pp-clear" type="button" title="Clear selection (Esc)">Clear</button>
      </div>
      <dl>
        <dt>Plate</dt>
        <dd id="pp-plate">—</dd>
        <dt>Present day</dt>
        <dd id="pp-present">—</dd>
        <dt id="pp-age-label">At 0 Ma</dt>
        <dd id="pp-at">—</dd>
        <dt>Track</dt>
        <dd id="pp-track">—</dd>
      </dl>
      <div class="note" id="pp-note"></div>
    </section>
    <div id="hint">Drag to orbit · Scroll to zoom (50 m – 2×10⁷ m) · Land LODs via /api · Click the globe to track a point · ←/→ step the timeline</div>
    <script type="module" src="/src/application.ts"></script>
  </body>
</html>
