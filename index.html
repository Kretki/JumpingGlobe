<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WGS84 Ellipsoid</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #hint {
        position: fixed;
        left: 16px;
        bottom: 16px;
        color: #9aa4b2;
        font: 14px/1.4 system-ui, sans-serif;
        pointer-events: none;
        user-select: none;
      }
      #coords {
        position: fixed;
        left: 16px;
        top: 16px;
        color: #c5d0de;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
        user-select: none;
        background: rgba(11, 15, 20, 0.72);
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(154, 164, 178, 0.2);
      }
      #coords b {
        color: #e8eef7;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="coords"></div>
    <div id="hint">Drag to orbit · Scroll to zoom (50 m – 2×10⁷ m)</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
