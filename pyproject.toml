[project]
name = "jumping-globe"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "defusedxml>=0.7.1,<0.8",
    "fastapi>=0.110.0",
    "polars>=2.0,<3",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
tools = [
    "defusedxml>=0.7.1",
    "gdal>=3.13.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit==2.10.1",
    "ruff>=0.17.0",
    "semgrep==1.180.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = [".", "tools"]

[tool.ruff.lint]
select = ["E", "F", "B", "S"]

[tool.bandit]
exclude_dirs = [".venv", "node_modules", "dist"]
